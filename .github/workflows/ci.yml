#
# Four jobs, sized against what each one actually costs. Measured per run before this
# layout (5 jobs, ~12-16 runner-minutes):
#
#   supply-chain audit      5m40   <- `cargo install cargo-audit` from source, every run
#   SQLLogic e2e            2m10   <- release build of the worker
#   metadata quality        2m25   <- the *same* release build again
#   fmt · clippy · doc      1m15
#   MSRV check              0m31
#
# Two of those were pure waste. `rustsec/audit-check` compiles cargo-audit and ~300 of its
# dependencies on a fresh runner each time, so the most expensive job in the matrix never
# built our code at all — a prebuilt binary does the same check in seconds. And the e2e and
# metadata jobs each built the release worker, so the release build ran twice; they are now
# one job that builds it once and then lints the binary it just produced.
#
# What remains is roughly halved and each job earns its slot: a debug job for the fast
# checks, a release job for anything that needs the actual binary, a cheap audit, and an
# MSRV check that has to use its own toolchain (and therefore its own cache) by definition.

name: CI

on:
  push:
    branches: [main]
    # Docs-only pushes have nothing for these jobs to check. Pull requests deliberately
    # have no such filter, so required checks always report on a PR.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
  # Advisories are published without us pushing anything, so the audit runs on its own
  # schedule. Every other job is skipped on this trigger — see the `if:` guards.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-test:
    name: fmt · clippy · doc · unit + proptest
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rustdoc (deny warnings)
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Unit tests + property-based fuzzing
        run: cargo test --workspace --all-features

  # Everything that needs the release binary, so it is built once. `run_tests.sh` builds it
  # and runs the SQLLogic suite against it; vgi-lint then reads the metadata out of the same
  # file. Splitting these paid for a second release build and bought nothing.
  release-checks:
    name: SQLLogic e2e (haybarn) · metadata quality (vgi-lint)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # The runner otherwise re-downloads haybarn (a DuckDB build, ~10 MB) every run.
          enable-cache: true

      - name: Install the haybarn unittest runner
        run: |
          uv tool install haybarn-unittest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The `vgi` extension comes from haybarn, which has builds the community repository
      # does not.
      - name: Install the vgi community extension
        run: echo "INSTALL vgi FROM community;" | uvx haybarn-cli

      - name: Run SQLLogic suite against the built worker
        run: ./run_tests.sh

      - name: vgi-lint
        uses: Query-farm/vgi-lint-check@v1
        with:
          location: "${{ github.workspace }}/target/release/vgi-matchrecognize-worker"
          fail-on: info

  audit:
    name: supply-chain audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A prebuilt release binary. `rustsec/audit-check` shells out to `cargo install
      # cargo-audit`, which compiled it from source on every run and made this the most
      # expensive job in CI (5m40) for a check that only reads Cargo.lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  msrv:
    name: MSRV check (rust-version from Cargo.toml)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Take the floor from the one place that defines it, so this job cannot test a
      # different compiler than the crates claim to support — and so bumping
      # `[workspace.package] rust-version` is tested without touching CI.
      - name: Read the MSRV from Cargo.toml
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ -z "$version" ]]; then
            echo "no rust-version in [workspace.package]" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV from Cargo.toml: $version"

      # The ref here is the *action's* version; the Rust version is the `toolchain` input.
      # Those must stay separate: this action also publishes version-like tags naming Rust
      # releases (`@1.97`), and pinning the MSRV that way let Dependabot "bump" it — it
      # proposed `@1.100`, a Rust release that does not exist, which failed the job while
      # also meaning a successful bump would have silently moved the floor being tested.
      - name: Install Rust toolchain (pinned MSRV)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      # Its own toolchain means its own artifacts; this cache cannot be shared with the
      # stable jobs.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo check (workspace, all features)
        run: cargo check --workspace --all-features
