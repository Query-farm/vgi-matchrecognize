[workspace]
resolver = "2"
members = ["crates/mr-core", "crates/mr-worker", "crates/mr-wasm"]
# mr-wasm only makes sense for wasm32-unknown-emscripten (it is a staticlib whose
# ring ops are supplied by emcc's --js-library), so keep it out of the default
# set: bare `cargo build` / `test` / `clippy` stay native-only and unchanged.
# Build it explicitly with `wasm/build.sh` or `-p mr-wasm`.
default-members = ["crates/mr-core", "crates/mr-worker"]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.97"
license = "MIT"
authors = ["Query Farm LLC <hello@query.farm>"]
repository = "https://github.com/Query-farm/vgi-matchrecognize"

[workspace.dependencies]
# VGI Rust SDK (worker side), published on crates.io. 0.24+ provides the wasm
# `vgi::wasm_worker!` macro used by mr-wasm; requires rustc 1.97 (see
# rust-version above). Base (feature-less) so each target can opt in: the native
# build takes the SDK's real defaults (`sqlite` + `transport-http`), while the
# wasm build must NOT — tokio/mio/axum and bundled SQLite do not compile for
# wasm32, and the browser transport serves over a byte channel rather than HTTP.
vgi = { version = "0.29", default-features = false }
vgi-rpc = { version = "0.21", default-features = false, features = ["macros"] }
arrow = { version = "59", default-features = false, features = ["ipc"] }
# LZ4 for the buffered-batch spool, applied to a whole record rather than through arrow's
# IPC buffer compression — see `spool::compression`.
#
# Chosen over zstd on the merits, not on portability: zstd is *already* linked natively
# (vgi-rpc's `http` feature pulls `dep:zstd`), and the spool does not exist on wasm at all
# (`spool::root` returns None there), so a C dependency would cost nothing. The reason is
# asymmetry — LZ4 decompresses at ~2-4 GB/s against zstd's ~1.2-1.8, and these bytes are
# read on the *serial* finalize path where wall clock already suffers, while compression
# happens on the parallel sink path where cores are idle. zstd -1 would buy ~1.5x more
# ratio for roughly twice the decompression cost.
lz4_flex = { version = "0.13", default-features = false, features = ["std"] }
# For `StreamDecoder`, which decodes a spool record from an aligned buffer without copying
# it. Not arrow's `ipc_compression` feature: that also enables arrow-ipc/zstd, and the
# spool compresses whole records itself rather than per buffer.
arrow-ipc = { version = "59", default-features = false }
# Mapping spool files so an uncompressed record's arrays borrow the mapping instead of a
# heap copy — see `spool::RecordCursor`.
memmap2 = "0.9"
arrow-array = "59"
arrow-buffer = "59"
arrow-data = "59"
arrow-schema = "59"
arrow-select = "59"
arrow-cast = "59"

mr-core = { path = "crates/mr-core" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

